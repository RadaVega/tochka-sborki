meta:
  environment: node
  toolchain:
    name: npm
    version: "20"
build:
  additionalCommands: "npx prisma generate && npm run build"
  artifacts:
    "dist/**": /dist/
    "server/**": /server/
    "prisma/**": /prisma/
    "package.json": /
    "package-lock.json": /
    "start-amvera.cjs": /
    ".env.example": /
run:
  command: "npm ci && npx prisma generate && node start-amvera.cjs"
service:
  port: 80
  healthcheck:
    path: /api/health