meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: "git fetch origin main && git reset --hard origin/main && rm -rf node_modules dist && npm ci && npx prisma generate && npm run build"

run:
  scriptName: start-amvera.cjs

service:
  port: 80
  healthcheck:
    path: /api/health