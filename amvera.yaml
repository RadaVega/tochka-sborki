meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: "curl -s https://raw.githubusercontent.com/RadaVega/tochka-sborki/main/src/pages/HeroPage.jsx > src/pages/HeroPage.jsx && curl -s https://raw.githubusercontent.com/RadaVega/tochka-sborki/main/src/pages/CompanyPathPage.jsx > src/pages/CompanyPathPage.jsx && curl -s https://raw.githubusercontent.com/RadaVega/tochka-sborki/main/src/pages/ContactsPage.jsx > src/pages/ContactsPage.jsx && curl -s https://raw.githubusercontent.com/RadaVega/tochka-sborki/main/src/pages/StudentPathPage.jsx > src/pages/StudentPathPage.jsx && rm -rf node_modules dist && npm ci && npx prisma generate && npm run build"

run:
  scriptName: start-amvera.cjs

service:
  port: 80
  healthcheck:
    path: /api/health