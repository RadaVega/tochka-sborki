meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

exclude:
    - node_modules
    - dist
    - .git
    - media-backup-*
    - "*.log"
    - .amveraignore

build:
  additionalCommands: "npx prisma generate && npm run build"

run:
  scriptName: start-amvera.cjs

service:
  port: 80
  healthcheck:
    path: /api/health
